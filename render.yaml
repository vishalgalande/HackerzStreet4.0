services:
  - type: web
    name: finfix-backend
    env: python
    region: ohio
    plan: free
    rootDir: src/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: POETRY_VERSION
        value: 1.8.4 # Prevents Render from hanging during Poetry 2.1.x auto-update
      - key: SUPABASE_URL
        value: "" # Fill this in the Render dashboard
      - key: SUPABASE_KEY
        value: "" # Fill this in the Render dashboard
      - key: RESEND_API_KEY
        value: "" # Fill this in the Render dashboard
      - key: OPENAI_API_KEY
        value: "" # Fill this in the Render dashboard
